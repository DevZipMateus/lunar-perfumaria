  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      scrollbar-width: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

    :root {
      --purple: #7B2880;
      --purple-dark: #4e1a53;
      --purple-deep: #0f0518;
      --gold: #C9A55A;
      --gold-light: #dfc07e;
      --gold-text: #7a5e26;
      --white: #ffffff;
      --font-head: 'Cormorant Garamond', serif;
      --font-body: 'Montserrat', sans-serif;
      --header-h: 80px;
      --trans: 0.3s ease;
    }

    body {
      font-family: var(--font-body);
      background: var(--white);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ===== HEADER ===== */
    #header {
      position: relative;
      height: var(--header-h);
      flex-shrink: 0;
      background: rgba(229,225,222,0.98);
      border-bottom: 1px solid rgba(123,40,128,0.14);
      z-index: 100;
    }

    .header-inner {
      max-width: 1400px; margin: 0 auto;
      padding: 0 28px; height: 100%;
      display: flex; align-items: center;
      justify-content: space-between; gap: 20px;
    }

    .header-logo {
      display: flex; align-items: center;
      text-decoration: none; flex-shrink: 0;
    }
    .header-logo img { height: 52px; width: auto; object-fit: contain; }

    .header-nav {
      display: flex; align-items: center; gap: 20px;
    }
    .header-nav a {
      font-size: .8rem; font-weight: 500;
      color: var(--purple-dark); text-decoration: none;
      letter-spacing: .06em; text-transform: uppercase;
      transition: color var(--trans);
    }
    .header-nav a:hover { color: var(--gold-text); }

    .btn-voltar {
      display: inline-flex; align-items: center; gap: 7px;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: var(--white) !important; padding: 9px 20px;
      border-radius: 99px; font-weight: 600 !important;
      font-size: .78rem !important; text-transform: none !important;
      letter-spacing: .02em !important;
      border: 1px solid rgba(201,165,90,0.25);
      transition: all var(--trans) !important;
    }
    .btn-voltar:hover {
      border-color: var(--gold) !important;
      background: linear-gradient(135deg, var(--purple-dark), var(--purple)) !important;
    }

    .hamburger-v {
      display: none; flex-direction: column; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 4px;
    }
    .hamburger-v span {
      display: block; width: 22px; height: 2px;
      background: var(--purple-dark); border-radius: 2px; transition: all .3s;
    }
    .hamburger-v.open span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
    .hamburger-v.open span:nth-child(2) { opacity: 0; }
    .hamburger-v.open span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

    #nav-mobile-v {
      position: absolute; top: var(--header-h); left: 0; right: 0;
      background: rgba(229,225,222,0.98); backdrop-filter: blur(22px);
      border-bottom: 1px solid rgba(123,40,128,0.14);
      z-index: 99; padding: 18px 24px 24px;
      display: flex; flex-direction: column; gap: 2px;
      transform: translateY(calc(-100% - var(--header-h) - 10px));
      transition: transform .35s cubic-bezier(0.4,0,0.2,1);
    }
    #nav-mobile-v.open { transform: translateY(0); }
    #nav-mobile-v a {
      font-size: .86rem; font-weight: 500;
      color: var(--purple-dark); text-decoration: none;
      padding: 12px 0; border-bottom: 1px solid rgba(123,40,128,0.12);
      letter-spacing: .06em; text-transform: uppercase;
      transition: color var(--trans);
    }
    #nav-mobile-v a:last-child { border-bottom: none; color: #1da851; font-weight: 600; }
    #nav-mobile-v a:hover { color: var(--gold-text); }

    /* ===== IFRAME AREA ===== */
    .vitrine-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .vitrine-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .header-inner { padding: 0 16px; }
      .header-nav { display: none; }
      .hamburger-v { display: flex; }
      .header-logo img { height: 44px; }
    }
    @media (max-width: 480px) {
      :root { --header-h: 66px; }
      .header-logo img { height: 38px; }
    }
  </style>
</head>

  <script>
    var menuBtnV = document.getElementById('menu-btn-v');
    var navMobileV = document.getElementById('nav-mobile-v');
    menuBtnV.addEventListener('click', function() {
      var isOpen = navMobileV.classList.toggle('open');
      menuBtnV.classList.toggle('open', isOpen);
      menuBtnV.setAttribute('aria-expanded', String(isOpen));
    });
    navMobileV.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', function() {
        navMobileV.classList.remove('open');
        menuBtnV.classList.remove('open');
        menuBtnV.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
